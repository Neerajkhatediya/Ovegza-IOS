
workflows:
  simulator-workflow:
    name: Build Swift iOS Simulator

    environment:
      xcode: latest

    scripts:
      - name: Check Xcode
        script: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: List Project Schemes
        script: |
          xcodebuild -list -project "yourproject.xcodeproj"

      - name: Build Swift Simulator
        script: |
          set -o pipefail

          xcodebuild \
            -project "yourproject.xcodeproj" \
            -scheme "yourscheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/build.log"

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
      - build.log
